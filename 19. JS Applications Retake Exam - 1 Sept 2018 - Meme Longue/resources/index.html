<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Meme Lounge</title>
    <link rel="stylesheet" href="style/navigation.css">
    <link rel="stylesheet" href="style/site.css">
    <link rel="stylesheet" href="style/welcome.css">
    <link rel="stylesheet" href="style/notifications.css">
    <link rel="stylesheet" href="style/login-register.css">
    <link rel="stylesheet" href="style/meme-feed.css">
    <link rel="stylesheet" href="style/my-memes.css">
    <link rel="stylesheet" href="style/meme-details.css">
    <link rel="stylesheet" href="style/user-profile.css">
    <link rel="stylesheet" href="style/footer.css">
    <link rel="stylesheet" href="style/user-meme-listings.css">
    <script src="./src/app.js" type="module" defer></script>
</head>

<body>
    <div id="container">
        <nav></nav>

        <div class="meme-details">
            <div class="my-meme-details">
                <a href="#" id="meme-title">Разбираемо...</a>
                <img src="https://scontent.fsof3-1.fna.fbcdn.net/v/t1.0-9/31924539_2110321352572189_5652160133854134272_n.jpg?_nc_cat=0&oh=dc73aad9af411f76454dd70ea1ab2775&oe=5C2FB35A">
                <div class="meme-props">
                    <h2>Description</h2>
                    <p class="meme-description">
                        И аз така...
                    </p>
                </div>


                <div class="meme-details-buttons">
                    <a class="meme-details-button" href="#">Created by User</a>
                    <a href="#" class="meme-details-button">Edit</a>
                    <a href="#" class="meme-details-button">Delete</a>
                </div>


            </div>
        </div>

        <div class="user-profile">
            <img id="user-avatar-url" src="https://i.pinimg.com/originals/7c/c7/a6/7cc7a630624d20f7797cb4c8e93c09c1.png" alt="user-profile">
            <h1>user</h1>
            <h2>user@abv.bg</h2>

            <a id="deleteUserButton" href="#">DELETE USER!</a>

            <p id="user-listings-title">User Memes
            </p>
            <div class="user-meme-listings">
                <div class="user-meme">
                    <a href="#" class="user-meme-title">Разбираемо...</a>
                    <a href=""> <img class="userProfileImage" src="https://scontent.fsof3-1.fna.fbcdn.net/v/t1.0-9/31924539_2110321352572189_5652160133854134272_n.jpg?_nc_cat=0&oh=dc73aad9af411f76454dd70ea1ab2775&oe=5C2FB35A"></a>

                    <div class="user-memes-buttons">
                     
                        <a href="#" class="user-meme-btn">Edit</a>
                        <a href="#" class="user-meme-btn">Delete</a>
                     
                    </div>
                </div>
                <p class="no-memes">No memes in database.</p>

            </div>
        </div>

        {{>footer}}

        <div class="footer">
            <p>Created by MarikMayhem</p>
        </div>
    </div>


    <div id="notifications">
        <div id="loadingBox" class="notification">
            <span>Loading …</span>
        </div>
        <div id="infoBox" class="notification">
            <span>Info</span>
        </div>
        <div id="errorBox" class="notification">
            <span>Error</span>
        </div>
    </div>

</body>

</html>
