<!DOCTYPE html>
<html lang="en">
`

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SoftWiki</title>
    <script type="module" src="./src/app.js" defer></script>
</head>

<body id="root">
    <main>
        <header>
            <h1><a class="home" href="/">SoftWiki</a></h1>
            <nav class="nav-buttons" id="ul-navbar"></nav>
        </header>    

        <!-- Edit -->
        <div class="container">
            <form action="#" method="">
                <fieldset>
                    <legend>Edit article</legend>
                    <p class="field title">
                        <input type="text" name="title" id="title" placeholder="Arrays">
                        <label for="title">Title:</label>
                    </p>
                    <p class="field category">
                        <select id="category" name="category" required>
                            <option value="">-- Изберете категория --</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="C#">C#</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                        </select>
                        <label for="category">Category:</label>
                    </p>
                    <p class="field content">
                        <textarea name="content" id="content"></textarea>
                        <label for="content">Content:</label>
                    </p>

                    <p class="field submit">
                        <button class="btn submit" type="submit">Edit</button>
                    </p>

                </fieldset>
            </form>
        </div>

        <!-- Details -->
        <div class="container details">
            <div class="details-content">
                <h2>Title</h2>
                <strong>Category</strong>
                <p>Content</p>
                <div class="buttons">
                    <a href="#" class="btn delete">Delete</a>
                    <a href="#" class="btn edit">Edit</a>
                    <a href="#" class="btn edit">Back</a>
                </div>
            </div>
        </div>

    </main>
    <footer>My Site © Show info....</footer>
</body>

</html>
