<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chirper</title>
    <link rel="stylesheet" href="./style/site.css">
    <link rel="stylesheet" href="./style/notifications.css">
    <link rel="shortcut icon" href="./public/favicon.ico" type="image/x-icon">
    <script type="module" src="./src/app.js" defer></script>
</head>
<body>
<main id="main">
    <header><span>Chirper</span></header>

    <div class="menu">
        <a href="/">Home</a>
        <a href="/dashboard">Discover</a>
        <a href="/chirps/me">Me</a>
        <a href="/auth/logout">Logout</a>
    </div>       

    <section id="viewProfile">
        <div class="content">
            <div class="chirper">

                <h2 class="titlebar">SoftUni</h2>

                <a id="btnFollow" class="chirp-author" href="#">Follow</a>

                <div id="userProfileStats" class="user-details">
                    <span>1 chirps</span> | <span>0 following</span> | <span>2 followers</span>
                </div>
            </div>
            <div id="profileChirps" class="chirps"><h2 class="titlebar">Chirps</h2>
                <article class="chirp">
                    <div class="titlebar">
                        <a href="#" class="chirp-author">SoftUni</a>
                        <span class="chirp-time">1 day</span>
                    </div>
                    <p>First place at OIB startup weekend!</p>
                </article>
            </div>
        </div>
    </section>

    <footer><p>Chirper SPA © 2017</p></footer>
</main>

<div id="notifications">
    <div id="loadingBox" class="notification" style="display: none;"><span>Loading …</span></div>
    <div id="infoBox" class="notification"><span>Info</span></div>
    <div id="errorBox" class="notification"><span>Error</span></div>
</div>

</body>
</html>
